name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend/CleanArchitecture

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CleanArchitecture.sln

      - name: Build
        run: dotnet build CleanArchitecture.sln --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test CleanArchitecture.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Backend/CleanArchitecture/TestResults
          if-no-files-found: ignore

      - name: Verify API starts
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5117
          ConnectionStrings__DefaultConnection: ""
        run: |
          dotnet run --project CleanArchitecture.WebApi --configuration Release --no-build --no-launch-profile > backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:5117/api/products > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat backend.log
              exit 1
            fi
            sleep 1
          done

          cat backend.log
          exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend/purchasing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/purchasing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Verify SSR server starts
        env:
          NG_ALLOWED_HOSTS: localhost,127.0.0.1
          PORT: 4000
        run: |
          npm run serve:ssr:purchasing > frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/ > response.html; then
              grep --quiet '<app-root' response.html
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat frontend.log
              exit 1
            fi
            sleep 1
          done

          cat frontend.log
          exit 1
